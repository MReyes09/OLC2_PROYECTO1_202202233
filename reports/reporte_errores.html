<!DOCTYPE html>
<html lang="en">
<head>
<title>Tabla de Errores</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body,h1,h2,h3,h4,h5,h6 {font-family: "Lato", sans-serif}
.w3-bar,h1,button {font-family: "Montserrat", sans-serif}
.fa-anchor,.fa-coffee {font-size:200px}
</style>
</head>
<body>


<div class="w3-top">
  <div class="w3-bar w3-red w3-card w3-left-align w3-large">
    <a class="w3-bar-item w3-button w3-hide-medium w3-hide-large w3-right w3-padding-large w3-hover-white w3-large w3-red" href="javascript:void(0);" onclick="myFunction()" title="Toggle Navigation Menu"><i class="fa fa-bars"></i></a>
    <a href="#" class="w3-bar-item w3-button w3-padding-large w3-white">Tabla de Errores</a>
  </div>

  
  <div id="navDemo" class="w3-bar-block w3-white w3-hide w3-hide-large w3-hide-medium w3-large">
  </div>
</div>


<header class="w3-container w3-red w3-center" style="padding:128px 16px">
<img src="../img/logo.png" alt="Logo de la empresa">
  <h1 class="w3-margin w3-jumbo">Tabla de Errores</h1>
  <p class="w3-xlarge">Compilador OLC2</p>
</header>


<div class="w3-row-padding w3-padding-64 w3-container">
  <div class="w3-content">
    <div class="w3-twothird">
      <h2>Listado de Errores</h2>
      <div class="w3-responsive">
        <table class="w3-table-all w3-hoverable">
          <thead>
            <tr class="w3-red">
              <th>No.</th>
              <th>Mensaje</th>
              <th>Línea</th>
              <th>Columna</th>
              <th>Tipo</th>
            </tr>
          </thead>
          <tbody>
            
              <tr>
                <td>1</td>
                <td>Error al evaluar la condicion case</td>
                <td>218</td>
                <td>1</td>
                <td>semántico</td>
              </tr>
            
              <tr>
                <td>2</td>
                <td>Error al evaluar la condicion case</td>
                <td>241</td>
                <td>1</td>
                <td>semántico</td>
              </tr>
            
              <tr>
                <td>3</td>
                <td>Error al evaluar la condicion case</td>
                <td>256</td>
                <td>1</td>
                <td>semántico</td>
              </tr>
            
          </tbody>
        </table>
      </div>
    </div>
    <div class="w3-third w3-center">
      <i class="fa fa-bug w3-padding-64 w3-text-red"></i>
    </div>
  </div>
</div>


<footer class="w3-container w3-black w3-center w3-opacity w3-padding-64">
    <h1 class="w3-margin w3-xlarge">Compilador OLC2</h1>
</footer>

<script>

function myFunction() {
  var x = document.getElementById("navDemo");
  if (x.className.indexOf("w3-show") == -1) {
    x.className += " w3-show";
  } else { 
    x.className = x.className.replace(" w3-show", "");
  }
}
</script>

</body>
</html>
